<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Live GPS Tracker (Smooth + Time Filter)</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      font-family: Arial, sans-serif;
    }
    #map {
      width: 100%;
      height: 100%;
    }
    .info-box {
      position: absolute;
      top: 10px;
      right: 10px; /* moved away from zoom buttons */
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      padding: 12px;
      border-radius: 10px;
      box-shadow: 0 0 8px rgba(0,0,0,0.3);
      font-size: 14px;
      width: 220px;
    }
    input {
      margin: 4px 0;
      padding: 4px;
      width: 180px;
    }
    button {
      margin-top: 6px;
      padding: 6px 10px;
      width: 100%;
    }
  </style>
</head>

<body>

<!-- TOP RIGHT CONTROL PANEL -->
<div class="info-box">
  <b>GPS Tracking</b><br>

  <label>User ID:</label><br>
  <input id="userId" type="text" placeholder="Enter Username"><br><br>

  <b>Live Tracking</b><br>
  <button id="liveBtn" onclick="startLiveTracking()">Load Live</button>
  <br>
<!--
  <b>History Range</b><br>

  <label>Start:</label><br>
  <input id="startTime" type="datetime-local"><br>

  <label>End:</label><br>
  <input id="endTime" type="datetime-local"><br>

  <button onclick="loadHistory()">Load Range</button>
-->
  <small id="lastUpdate" 
        style="display:block;margin-top:6px;color:#666;"></small>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
/* ============================
      GLOBAL VARIABLES
============================ */
let map, polyline, trailCoords = [], liveMarker = null;
let autoRefreshInterval = 8000; 
let userId = "";
let liveMode = false;    // IMPORTANT FIX
let wasLiveBefore = false;
let lastHistoryId = 0;
let lastLiveId = 0;
let isFetching = false;
let jobsiteMarker = null;
let routePolyline = null;
let jobsiteLatLng = null;
let selectedApi = "Google";
let lastRouteFetchPoint = null;
let ROUTE_REFRESH_DISTANCE = 30; 
let currentETA = "";

/* ============================
          INIT MAP
============================ */
function initMap() {
  map = L.map('map').setView([20.5937, 78.9629], 5);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  // Only update when in live mode
  setInterval(() => {
    if (liveMode) loadLiveUpdates();
  }, autoRefreshInterval);
}

/* ============================
   LOAD HISTORY (FULL RANGE)
============================ */
async function loadHistory() {
  wasLiveBefore = false;
  liveMode = false;  // STOP LIVE UPDATES
  lastRouteFetchPoint = null;

  
  userId = document.getElementById("userId").value;
  if (!userId) {
    alert("Enter user ID");
    document.getElementById("liveBtn").disabled = false;
    return;
  }
  const start = document.getElementById("startTime").value;
  const end   = document.getElementById("endTime").value;

  let url = `/get_locations?user_id=${userId}&limit=5000`;
  if (start) url += `&start=${start}`;
  if (end)   url += `&end=${end}`;

  console.log("Loading history:", url);

  let data = [];
  try {
    const resp = await fetch(url);
    data = await resp.json();
  } catch (e) {
    console.error("API error", e);
    alert("Failed to load data");
    return;
  }

  trailCoords = [];
  lastHistoryId = 0;
  routePolyline = null;
  lastRouteFetchPoint = null;

if (polyline) {
    polyline.remove();
    polyline = null;     
}
if (liveMarker) {
    liveMarker.remove();
    liveMarker = null;   
}


  if (!data.length) {
    alert("No data found for this range");
    return;
  }

  data.forEach(p => {
    trailCoords.push([p.lat, p.lng]);
    lastHistoryId = p.id;
    if (trailCoords.length > 5000) {
      trailCoords.shift();
    }
    
  });


  setTimeout(() => {
      drawPolyline();
      placeMarker(trailCoords.at(-1));
      const last = trailCoords.at(-1);
      fetchRoute(last[0], last[1]);
  }, 50);


  document.getElementById("lastUpdate").innerText =
    `Loaded ${data.length} points | Last History ID: ${lastHistoryId}`;
}

/* ============================
     LOAD LIVE MODE
============================ */
async function startLiveTracking() {
  document.getElementById("liveBtn").disabled = true;
  liveMode = false;
  await new Promise(r => setTimeout(r, 150));

  wasLiveBefore = true;
  liveMode = true;
  lastRouteFetchPoint = null;

  userId = document.getElementById("userId").value;
  if (!userId) {
    alert("Enter user ID");
    return;
  }

  trailCoords = [];
  lastLiveId = 0;
  routePolyline = null;
  lastRouteFetchPoint = null;


if (polyline) {
    polyline.remove();
    polyline = null;    // <-- ADD THIS
}
if (liveMarker) {
    liveMarker.remove();
    liveMarker = null;  // <-- ADD THIS
}


  // Load ONLY 2000 points for performance
  let data = [];

  try {
    const resp = await fetch(`/get_locations?user_id=${userId}&limit=2000`);
    data = await resp.json();
  } catch (e) {
    console.error("Live load error", e);
    alert("Failed to load live data");
    document.getElementById("liveBtn").disabled = false;
    return;
  }

  if (!data.length) {
    alert("No data found for this user");
    document.getElementById("liveBtn").disabled = false;
    return;
  }

  data.forEach(p => {
    trailCoords.push([p.lat, p.lng]);
    lastLiveId = p.id;
    if (trailCoords.length > 5000) {
      trailCoords.shift();
    }
  });

  setTimeout(() => {
    drawPolyline(); 
    placeMarker(trailCoords.at(-1));
    const last = trailCoords.at(-1);
    fetchRoute(last[0], last[1]);
  }, 50);

  document.getElementById("lastUpdate").innerText =
    `Live tracking started | Last Live ID: ${lastLiveId}`;

  document.getElementById("liveBtn").disabled = false;
  setTimeout(loadLiveUpdates, 500);
  }

/* ============================
    INCREMENTAL LIVE UPDATE
============================ */
async function loadLiveUpdates() {
  if (!lastLiveId || !liveMode || isFetching) return;

  isFetching = true;

  try {
    const url = `/get_locations?user_id=${userId}&after_id=${lastLiveId}`;
    const resp = await fetch(url);
    const newPoints = await resp.json();

    if (!newPoints.length) return;

    newPoints.forEach(p => {
      trailCoords.push([p.lat, p.lng]);
      lastLiveId = p.id;

      if (trailCoords.length > 5000) {
        trailCoords.shift();
      }
      
    });

    if (polyline) {
      polyline.addLatLng(trailCoords.at(-1));
    } else {
      drawPolyline();
    }

    const latest = trailCoords.at(-1);

    animateMarker(latest);
    fetchRoute(latest[0], latest[1]);

    document.getElementById("lastUpdate").innerText =
      "Updated @ " + new Date().toLocaleTimeString();

  } catch (e) {
    console.error("Live update error", e);
  } finally {
    isFetching = false;
  }
}

/* ============================
     DRAW / UPDATE POLYLINE
============================ */
function drawPolyline() {
  if (!polyline) {
    polyline = L.polyline(trailCoords, {
      color: 'blue',
      weight: 4,
      opacity: 0.8
    }).addTo(map);
  } else {
    polyline.addLatLng(trailCoords.at(-1));
  }

  // ADD THIS
  if (trailCoords.length > 1) {
    map.fitBounds(trailCoords);
  }
}

/* ============================
     PLACE STATIC MARKER
============================ */

function placeMarker(latlng) {
  liveMarker = L.circleMarker(latlng, {
    radius: 8,
    fillColor: 'red',
    color: 'white',
    weight: 2,
    fillOpacity: 1
  }).addTo(map);

  // Only zoom first time
  if (trailCoords.length <= 2) {
    map.flyTo(latlng, 16, { duration: 2 });
  }
}

function setJobsite(lat, lng) {
  jobsiteLatLng = [lat, lng];

  if (jobsiteMarker) {
    jobsiteMarker.remove();
  }

  jobsiteMarker = L.marker(jobsiteLatLng)
    .addTo(map)
    .bindPopup("Jobsite")
    .openPopup();
}

function drawRoute(coords) {
  if (!routePolyline) {
    routePolyline = L.polyline(coords, {
      color: 'green',
      weight: 5,
      opacity: 0.9
    }).addTo(map);
  } else {
    routePolyline.setLatLngs(coords);
  }

  map.fitBounds(routePolyline.getBounds(), { padding: [50, 50] });
}

function getDistanceMeters(a, b) {
  const R = 6371000; // meters
  const dLat = (b[0] - a[0]) * Math.PI / 180;
  const dLng = (b[1] - a[1]) * Math.PI / 180;

  const lat1 = a[0] * Math.PI / 180;
  const lat2 = b[0] * Math.PI / 180;

  const x = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.sin(dLng/2) * Math.sin(dLng/2) *
            Math.cos(lat1) * Math.cos(lat2);

  const c = 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1-x));

  return R * c;
}


async function fetchRoute(fromLat, fromLng) {
  if (!jobsiteLatLng) return;

  const currentPoint = [fromLat, fromLng];

  // 🚀 Skip if movement is small
  if (lastRouteFetchPoint) {
    const dist = getDistanceMeters(lastRouteFetchPoint, currentPoint);

    if (dist < ROUTE_REFRESH_DISTANCE) {
      return; // 🔥 skip API call
    }
  }

  lastRouteFetchPoint = currentPoint;

  try {
    const resp = await fetch(
      `/get_route?from_lat=${fromLat}&from_lng=${fromLng}&to_lat=${jobsiteLatLng[0]}&to_lng=${jobsiteLatLng[1]}&api=${selectedApi}`
    );

    const data = await resp.json();

    console.log("ROUTE DATA:", data);

    if (data.route && data.route.length > 0) {
    drawRoute(data.route);
    }

    if (data.eta) {
    const minutes = Math.round(data.eta / 60);
    currentETA = minutes + " min";

    document.getElementById("lastUpdate").innerText =
        "ETA: " + currentETA + " | Updated: " + new Date().toLocaleTimeString();
    }

  } catch (e) {
    console.error("Route fetch failed", e);
  }
}

/* ============================
   SMOOTH MARKER MOVEMENT
============================ */
function animateMarker(newLatLng) {
  if (!liveMarker) return placeMarker(newLatLng);

  const start = liveMarker.getLatLng();
  const end   = L.latLng(newLatLng[0], newLatLng[1]);
  const durationMs = 2000;

  const startTime = performance.now();
  
  function animate(now) {
    if (!liveMode) return;
    let t = Math.min((now - startTime) / durationMs, 1);

const lat = start.lat + (end.lat - start.lat) * t;
const lng = start.lng + (end.lng - start.lng) * t;

liveMarker.setLatLng([lat, lng]);
map.panTo([lat, lng], { animate: false });
    if (t < 1) requestAnimationFrame(animate);
  }

  requestAnimationFrame(animate);
}

/* ============================
     LAUNCH MAP
============================ */
document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
        // Save whether we were in live mode
        wasLiveBefore = liveMode;
        liveMode = false; // stop updates
    } else {
        // Resume only if Live Mode was already active before leaving
        if (wasLiveBefore) {
            liveMode = true;
            wasLiveBefore = false;
            loadLiveUpdates();  // immediate refresh
        }
    }
});

initMap();

window.setApiFromApp = function(api) {
  selectedApi = api;
};

window.setJobsiteFromApp = function(lat, lng) {
  setJobsite(lat, lng);
};

</script>
</body>
</html>
